apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
  namespace: mysql
  labels:
    app: mysql
spec:
  containers:
  - name: mysql
    image: 007259615064.dkr.ecr.us-east-1.amazonaws.com/mysql:v1
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 3306
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: "rootpass123"
    - name: MYSQL_DATABASE
      value: "employees"
    - name: MYSQL_USER
      value: "admin"
    - name: MYSQL_PASSWORD
      value: "admin123"